; Keep environment variables (APP_KEY, DB_*, ...) visible to PHP workers.
[www]
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Sized for a small instance (Render free/starter is 512 MB). Raise on a bigger plan.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
