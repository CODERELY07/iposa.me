# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service (nginx + PHP-FPM + scheduler) and a managed Postgres database.
# Deploy: Render dashboard → New → Blueprint → pick this repo. Fill the "sync: false" values when asked.

databases:
  - name: iposa-db
    databaseName: iposa
    user: iposa
    region: singapore        # closest Render region to the Philippines
    plan: free               # free Postgres expires after 30 days: switch to basic-256mb for real shops

services:
  - type: web
    name: iposa
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free               # free instances sleep after ~15 min idle; use starter for a shop that's open all day
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: iPOSa
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true  # start.sh adds Laravel's "base64:" prefix
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: APP_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: iposa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iposa-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: iposa-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: iposa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iposa-db
          property: password

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Email: sign-up verification and staff invites need a real mail provider.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: iPOSa

      # Platform operator account, created on first deploy (password: 12+ characters).
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

      # Where owners send their subscription payment (shown in Settings → Plan & billing).
      - key: BILLING_GCASH_NUMBER
        sync: false
      - key: BILLING_GCASH_NAME
        value: iPOSa
      - key: BILLING_BANK
        sync: false

      # "true" loads the demo shops (demo logins use the password "password"). Keep "false" for real use.
      - key: SEED_DEMO_DATA
        value: "false"
