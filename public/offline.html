<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0c0a09">
    <title>You're offline · iPOSa</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0c0a09; color: #e7e5e4;
        }
        @media (prefers-color-scheme: light) { body { background: #fafaf9; color: #1c1917; } .muted { color: #57534e !important; } .ghost { border-color: #d6d3d1 !important; color: #1c1917 !important; } }
        main { max-width: 380px; text-align: center; }
        svg { width: 64px; height: 64px; }
        h1 { margin: 20px 0 8px; font-size: 24px; letter-spacing: -0.02em; }
        .muted { color: #a8a29e; }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
        a, button {
            display: block; width: 100%; padding: 14px 16px; border-radius: 14px; font: inherit; font-weight: 600;
            text-decoration: none; cursor: pointer; border: 1px solid transparent;
        }
        .primary { background: #ffad20; color: #0c0a09; }
        .ghost { background: transparent; color: #e7e5e4; border-color: rgba(255,255,255,.12); }
        .status { margin-top: 18px; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#ffad20"/><rect x="178" y="214" width="72" height="178" rx="36" fill="#0c0a09"/><circle cx="214" cy="152" r="42" fill="#0c0a09"/><circle cx="323" cy="355" r="37" fill="#0c0a09"/></svg>
        <h1>You're offline</h1>
        <p class="muted">This page needs internet. The register still works: sales are saved on this device and sync by themselves when the connection is back.</p>
        <div class="actions">
            <a class="primary" href="/pos">Open the register</a>
            <button class="ghost" type="button" onclick="location.reload()">Try again</button>
        </div>
        <p class="status muted" id="status">Waiting for a connection…</p>
    </main>
    <script>
        window.addEventListener('online', () => {
            document.getElementById('status').textContent = 'Back online. Reloading…';
            setTimeout(() => location.reload(), 600);
        });
    </script>
</body>
</html>
